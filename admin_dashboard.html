<script>
  function openChangePassword(){
  document.getElementById('changePasswordModal').style.display = 'flex';
}

function closeChangePassword(){
  document.getElementById('changePasswordModal').style.display = 'none';
}

function submitChangePassword(){
  const current = document.getElementById('currentPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;

  if(!current || !newPwd || !confirmPwd){
    alert('All fields are required');
    return;
  }

  if(newPwd !== confirmPwd){
    alert('Passwords do not match');
    return;
  }

  fetch('admin_change_password.php',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      current_password: current,
      new_password: newPwd
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.success){
      alert('Password changed successfully');
      closeChangePassword();
      document.getElementById('currentPwd').value='';
      document.getElementById('newPwd').value='';
      document.getElementById('confirmPwd').value='';
    }else{
      alert(data.message);
    }
  })
  .catch(()=>alert('Error changing password'));
}

const select = document.getElementById('applicantSelect');
const container = document.getElementById('pds-container');
let submissions = [];

// Fetch submissions from the database
fetch('get_submissions.php')
.then(res => res.json())
.then(data => {
    submissions = data;
    submissions.forEach((sub, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.text = `${sub.last_name}, ${sub.first_name} - ${sub.submission_date}`;
        select.appendChild(option);
    });
});

select.addEventListener('change', function(){
    const idx = this.value;
    container.innerHTML = '';
    if(idx === '') return;

    const sub = submissions[idx];
    const div = document.createElement('div');
    div.id = 'pds';
    div.classList.add('form-wrapper');

    div.innerHTML = elementHTML(sub); // build the PDS content
    container.appendChild(div);
});

// PDF Export
function downloadSelectedPDS(){
    const idx = select.value;
    if(idx === '') { alert("Please select an applicant."); return; }

    const element = document.getElementById('pds');
    if(!element) return;

    const buttons = element.querySelectorAll('button, select');
    buttons.forEach(btn => btn.style.display = 'none');

    html2canvas(element, {scale:2}).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'pt', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`PDS_${submissions[idx].last_name}_${submissions[idx].first_name}.pdf`);

        buttons.forEach(btn => btn.style.display = 'block');
    });
}

// Enhanced Excel Export with Title like PDF
function exportAllToExcel() {
    if(submissions.length === 0){
        alert("No submissions to export!");
        return;
    }

    const exportData = submissions.map(sub => ({
        "Last Name": sub.last_name || "",
        "First Name": sub.first_name || "",
        "Middle Name": sub.middle_name || "",
        "Maiden Name": sub.maiden_name || "",
        "Present Address": sub.present_address || "",
        "Telephone": sub.telephone || "",
        "Permanent Address": sub.permanent_address || "",
        "Cellphone": sub.cellphone || "",
        "Age": sub.age || "",
        "Height": sub.height || "",
        "Weight": sub.weight || "",
        "Birthdate": sub.birthdate || "",
        "Birthplace": sub.birthplace || "",
        "Sex": sub.sex || "",
        "Civil Status": sub.civil_status || "",
        "Citizenship": sub.citizenship || "",
        "Religion": sub.religion || "",
        "Email": sub.email || "",
        "SSS No.": sub.sss_no || "",
        "TIN": sub.tin || "",
        "PhilHealth": sub.philhealth || "",
        "Pag-IBIG": sub.pagibig || "",
        "Father's Name": sub.father_name || "",
        "Father's Occupation": sub.father_occupation || "",
        "Mother's Name": sub.mother_name || "",
        "Mother's Occupation": sub.mother_occupation || "",
        "Spouse Name": sub.spouse_name || "",
        "Spouse Occupation": sub.spouse_occupation || "",
        "Elementary School": sub.elementary_school || "",
        "Elementary Dates": sub.elementary_dates || "",
        "Elementary Honors": sub.elementary_honors || "",
        "Secondary School": sub.secondary_school || "",
        "Secondary Dates": sub.secondary_dates || "",
        "Secondary Honors": sub.secondary_honors || "",
        "Tertiary School": sub.tertiary_school || "",
        "Tertiary Dates": sub.tertiary_dates || "",
        "Tertiary Honors": sub.tertiary_honors || "",
        "Employer 1": sub.employer1 || "",
        "Position 1": sub.position1 || "",
        "Dates 1": sub.dates1 || "",
        "Salary 1": sub.salary1 || "",
        "Reason 1": sub.reason1 || "",
        "Employer 2": sub.employer2 || "",
        "Position 2": sub.position2 || "",
        "Dates 2": sub.dates2 || "",
        "Salary 2": sub.salary2 || "",
        "Reason 2": sub.reason2 || "",
        "Special Condition": sub.special_condition || "",
        "Special Condition Details": sub.special_condition_details || "",
        "Past Illness": sub.past_illness || "",
        "Past Illness Details": sub.past_illness_details || "",
        "Allergic Disorders": sub.allergic ? "Yes" : "No",
        "Cardiovascular": sub.cardio ? "Yes" : "No",
        "Pulmonary": sub.pulmonary ? "Yes" : "No",
        "Gastrointestinal": sub.gastro ? "Yes" : "No",
        "Musculoskeletal": sub.musculo ? "Yes" : "No",
        "Vision": sub.vision ? "Yes" : "No",
        "None Condition": sub.none_condition ? "Yes" : "No",
        "Medical Details": sub.medical_details || "",
        "Submission Date": sub.submission_date || "",
        "Signature": sub.signature || ""
    }));

    const worksheet = XLSX.utils.json_to_sheet(exportData, {origin: 4}); // start at row 5

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "All Submissions");

    // Merge first 3 rows for the title
    const totalColumns = Object.keys(exportData[0]).length;
    worksheet['!merges'] = [
        {s:{r:0,c:0}, e:{r:0,c:totalColumns-1}},
        {s:{r:1,c:0}, e:{r:1,c:totalColumns-1}},
        {s:{r:2,c:0}, e:{r:2,c:totalColumns-1}}
    ];

    // Add title values
    worksheet['A1'] = {v:"ALPHATECH DEVELOPMENT CORPORATION", t:"s", s:{font:{bold:true, sz:16}, alignment:{horizontal:"center"}}};
    worksheet['A2'] = {v:"HUMAN RESOURCE UNIT", t:"s", s:{font:{bold:true, sz:14}, alignment:{horizontal:"center"}}};
    worksheet['A3'] = {v:"PERSONAL DATA SHEET", t:"s", s:{font:{bold:true, sz:14}, alignment:{horizontal:"center"}}};

    // Style headers
    const range = XLSX.utils.decode_range(worksheet['!ref']);
    for(let C = range.s.c; C <= range.e.c; ++C){
        const address = XLSX.utils.encode_cell({r:4, c:C}); // header row at row 5
        if(!worksheet[address]) continue;
        worksheet[address].s = {
            font: { bold:true, sz:12, color:{rgb:"FFFFFF"} },
            fill: { fgColor:{rgb:"555555"} },
            alignment: { horizontal:"center", vertical:"center" },
            border: {
                top:{style:"thin", color:{rgb:"000000"}},
                bottom:{style:"thin", color:{rgb:"000000"}},
                left:{style:"thin", color:{rgb:"000000"}},
                right:{style:"thin", color:{rgb:"000000"}}
            }
        };
    }

    // Style data rows with borders & alternating colors
    for(let R = 5; R <= range.e.r; ++R){
        for(let C = range.s.c; C <= range.e.c; ++C){
            const address = XLSX.utils.encode_cell({r:R, c:C});
            if(!worksheet[address]) worksheet[address] = {v:""};
            worksheet[address].s = {
                font: { sz:11 },
                fill: { fgColor:{rgb: (R%2===0)?"FFFFFF":"F2F2F2"} },
                alignment: { vertical:"top", wrapText:true },
                border: {
                    top:{style:"thin", color:{rgb:"000000"}},
                    bottom:{style:"thin", color:{rgb:"000000"}},
                    left:{style:"thin", color:{rgb:"000000"}},
                    right:{style:"thin", color:{rgb:"000000"}}
                }
            };
        }
    }

    // Set column widths
    const wscols = [];
    for(let C = range.s.c; C <= range.e.c; ++C){
        wscols.push({wch:25});
    }
    worksheet['!cols'] = wscols;

    XLSX.writeFile(workbook, "All_PDS_Submissions.xlsx");
}

// Word Export
function downloadWord() {
    const idx = select.value;
    if(idx === '') { alert("Please select an applicant."); return; }
    const sub = submissions[idx];
    const element = document.getElementById('pds');
    if(!element) return;

    const style = `
<style>
body { font-family: Arial; color:#000; }
h1{font-size:28px;font-weight:bold;text-align:center;}
h2{font-size:20px;font-weight:normal;text-align:center;}
h3{font-size:26px;font-weight:bold;text-align:center;}
table{width:100%;border-collapse:collapse;margin-bottom:6px;}
td,th{border:1px solid #000;padding:6px;vertical-align:top;font-size:14px;}
.section-title{background:#555;color:#fff;font-weight:bold;}
</style>
`;

    const htmlContent = `<html><head><meta charset="utf-8">${style}</head><body>${element.outerHTML}</body></html>`;
    const blob = new Blob([htmlContent], {type: 'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PDS_${sub.last_name}_${sub.first_name}.doc`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function logout() {
    window.location.href = 'admin_login.html';
}

<script>
  // Toggle password visibility
  const toggles = document.querySelectorAll('.toggle-pass');
  toggles.forEach(toggle => {
    toggle.addEventListener('click', () => {
      const targetId = toggle.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if(input.type === 'password'){
        input.type = 'text';
        toggle.textContent = '🙈';
      } else {
        input.type = 'password';
        toggle.textContent = '👁️';
      }
    });
  });
